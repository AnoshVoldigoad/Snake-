name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Tambah platform Android
        run: npx cap add android

      - name: Ikon aplikasi
        run: |
          pip install pillow
          python scripts/make_icons.py
          sed -i 's/#FFFFFF/#23134E/I' android/app/src/main/res/values/ic_launcher_background.xml

      - name: Kunci orientasi portrait
        run: sed -i '0,/<activity/s//<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Sync aset web
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ular-Ditooolak-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
